fonts:
  - family: Rustic
    fonts:
      # Основное начертание
      - asset: assets/fonts/Rustic-Regular.ttf

      # Жирное начертание (700 weight)
      - asset: assets/fonts/Rustic-Bold.ttf
        weight: 700

